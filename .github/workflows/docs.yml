name: Docs

# Asks the public docs repository (Newscatcher/docs) to update the MCP server's pages after every
# push to main. The docs repository reads the change from this public repository and opens a docs
# PR for review; nothing here reads or changes the docs.

on:
  push:
    branches: [main]

# The dispatch uses its own token (below); the GitHub token gets nothing.
permissions: {}

jobs:
  dispatch:
    name: Ask the docs repository for an update
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to Newscatcher/docs
        env:
          # Fine-grained token for Newscatcher/docs only, permission "Contents: Read and write"
          # (what repository_dispatch requires).
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PROJECT: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$DOCS_DISPATCH_TOKEN" ]; then
            echo "::notice::DOCS_DISPATCH_TOKEN is not set; no docs update requested."
            exit 0
          fi
          body=$(jq -n --arg project "$PROJECT" --arg before "$BEFORE" --arg after "$AFTER" \
            '{event_type: "mcp-main-push", client_payload: {project: $project, before: $before, after: $after}}')
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DOCS_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Newscatcher/docs/dispatches \
            -d "$body")
          if [ "$code" != "204" ]; then
            echo "::error::The docs repository did not accept the dispatch (HTTP ${code}): $(head -c 300 response.txt)"
            exit 1
          fi
          echo "Asked Newscatcher/docs to update the MCP docs for ${BEFORE:0:7}..${AFTER:0:7}."
